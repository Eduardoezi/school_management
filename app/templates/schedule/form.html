{% extends "base.html" %}
{% block title %}{{ 'Editar' if schedule else 'Nuevo' }} Horario{% endblock %}
{% block content %}
<h2>{{ 'Editar' if schedule else 'Nuevo' }} Horario</h2>
<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="code_schedules" class="form-label">Código</label>
            <input type="text" class="form-control" id="code_schedules" name="code_schedules"
                   value="{{ schedule.code_schedules if schedule else '' }}" placeholder="Ej: MAT-01">
        </div>
        <div class="col-md-6 mb-3">
            <label for="day_of_week" class="form-label">Día de la semana *</label>
            <select class="form-select" id="day_of_week" name="day_of_week" required>
                <option value="">Seleccione</option>
                {% set dias = [('1','Lunes'),('2','Martes'),('3','Miércoles'),('4','Jueves'),('5','Viernes'),('6','Sábado'),('7','Domingo')] %}
                {% for val, nombre in dias %}
                <option value="{{ val }}" {% if schedule and schedule.day_of_week == val|int %}selected{% endif %}>
                    {{ nombre }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label for="start_time" class="form-label">Hora de inicio *</label>
            <input type="time" class="form-control" id="start_time" name="start_time"
                   value="{{ schedule.start_time if schedule else '' }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="end_time" class="form-label">Hora de fin *</label>
            <input type="time" class="form-control" id="end_time" name="end_time"
                   value="{{ schedule.end_time if schedule else '' }}" required>
        </div>
    </div>
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{{ url_for('schedule.list_view') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
