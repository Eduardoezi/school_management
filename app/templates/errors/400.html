{% extends "base.html" %}
{% block title %}Solicitud Incorrecta{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="text-center" style="max-width: 520px;">
        <div class="mb-4">
            <i class="bi bi-compass" style="font-size: 5rem; color: #f59e0b;"></i>
        </div>
        <h1 class="h3 mb-3">Bad Request / Solicitud Incorrecta</h1>
        <p class="text-muted mb-4">
            El servidor no pudo procesar la petición del usuario.
        </p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">
                <i class="bi bi-house me-1"></i>Ir al panel
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Volver
            </a>
        </div>
        <p class="text-muted small mt-4 mb-0">
            Código de error: <code>400 · Bad Request</code>
        </p>
    </div>
</div>
{% endblock %}
