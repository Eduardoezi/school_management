{% extends "base.html" %}
{% block title %}Editar estudio socioeconómico{% endblock %}
{% block content %}

<h2 class="page-title">
    <i class="bi bi-house-heart me-2"></i>Estudio socioeconómico
</h2>
<p class="text-muted">
    student: <strong>{{ student.first_name }} {{ student.last_name }}</strong>
</p>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="card">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">¿Actualmente el student vive con?</label>
                    <input type="text" class="form-control" name="lives_with"
                           value="{{ socioeconomic.lives_with if socioeconomic else '' }}"
                           placeholder="Padre / Madre / Tutores / Otros">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">¿Qué otros miembros integran el grupo familiar?</label>
                    <input type="text" class="form-control" name="other_family_members"
                           value="{{ socioeconomic.other_family_members if socioeconomic else '' }}">
                </div>

                <div class="col-md-3 mb-3">
                    <label class="form-label">¿Cuántos miembros trabajan?</label>
                    <input type="number" class="form-control" name="working_members" min="0"
                           value="{{ socioeconomic.working_members if socioeconomic else '' }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Ingreso familiar mensual</label>
                    <input type="number" step="0.01" class="form-control" name="monthly_income" min="0"
                           value="{{ socioeconomic.monthly_income if socioeconomic else '' }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">¿Cuántos miembros habitan el hogar?</label>
                    <input type="number" class="form-control" name="household_members" min="0"
                           value="{{ socioeconomic.household_members if socioeconomic else '' }}">
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">¿Cuántas habitaciones tiene la vivienda?</label>
                    <input type="number" class="form-control" name="rooms_count" min="0"
                           value="{{ socioeconomic.rooms_count if socioeconomic else '' }}">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Tipo de vivienda</label>
                    <input type="text" class="form-control" name="housing_type"
                           value="{{ socioeconomic.housing_type if socioeconomic else '' }}"
                           placeholder="Casa, apartamento, rancho, etc.">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Condición de la vivienda</label>
                    <input type="text" class="form-control" name="housing_condition"
                           value="{{ socioeconomic.housing_condition if socioeconomic else '' }}"
                           placeholder="Propia, alquilada, prestada, etc.">
                </div>

                <div class="col-12 mb-3">
                    <label class="form-label">Infraestructura de la vivienda</label>
                    <textarea class="form-control" name="housing_infrastructure" rows="3"
                              placeholder="Servicios: agua, luz, gas, internet...">{{ socioeconomic.housing_infrastructure if socioeconomic else '' }}</textarea>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle me-1"></i>Guardar
        </button>
        <a href="{{ url_for('student_profile.view', student_id=student.id) }}"
           class="btn btn-secondary">Cancelar</a>
    </div>
</form>

{% endblock %}
