<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Sistema Escolar - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #1e40af 100%);
            background-attachment: fixed;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .public-container {
            position: relative;
            z-index: 1;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .alert {
            border-radius: 12px;
            border: none;
            backdrop-filter: blur(8px);
        }

        .alert-success { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .alert-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        .alert-warning { background: rgba(234, 179, 8, 0.2); color: #fde047; }
        .alert-info { background: rgba(59, 130, 246, 0.2); color: #93c5fd; }

        .alert .btn-close { filter: invert(1); }

        a { text-decoration: none; }

        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.96);
            border: 1px solid #cbd5e1;
            color: #172033;
            color-scheme: light;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: #fff;
            border-color: #3b82f6;
            color: #172033;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .form-control::placeholder { color: #64748b; opacity: 1; }

        .form-select option,
        .form-select optgroup {
            background-color: #fff;
            color: #172033;
        }

        .form-control:disabled,
        .form-control[readonly],
        .form-select:disabled {
            background-color: #e2e8f0;
            color: #475569;
            opacity: 1;
        }

        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus {
            -webkit-text-fill-color: #172033;
            box-shadow: 0 0 0 1000px #fff inset;
        }

        .form-label {
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
        }

        .form-text, small.text-muted {
            color: rgba(255, 255, 255, 0.78) !important;
        }

        .public-muted-text { color: #cbd5e1 !important; }

        .btn {
            border-radius: 10px;
            font-weight: 500;
            padding: 0.6rem 1.25rem;
            transition: transform 0.15s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
        }

        .btn-outline-light { border-color: rgba(255, 255, 255, 0.4); }
        .btn-outline-light:hover { background: rgba(255, 255, 255, 0.1); }

        .public-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            --bs-body-color: #212529;
            --bs-body-bg: #fff;
            color-scheme: light;
        }

        .public-card h1, .public-card h2, .public-card h3,
        .public-card h4, .public-card h5, .public-card h6 {
            color: #fff;
        }

        .public-card p, .public-card ul, .public-card li {
            color: #cbd5e1;
        }

        .public-light-card {
            color: #172033;
            border: 1px solid rgba(203, 213, 225, 0.8);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22);
        }

        .public-light-card .form-label,
        .public-light-card p {
            color: #172033;
        }

        .public-light-card .form-text,
        .public-light-card small.text-muted {
            color: #475569 !important;
        }

        .public-card a:not(.btn) { color: #93c5fd; }
        .public-card a:not(.btn):hover { color: #bfdbfe; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="public-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
