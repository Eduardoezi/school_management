{% extends "base.html" %}
{% block title %}Registro de Docente{% endblock %}
{% block content %}
<h2>➕ Registrar Nuevo Docente</h2>
<form method="POST">
    <h4>Datos del Docente</h4>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="id" class="form-label">Cédula de Identidad *</label>
            <input type="number" class="form-control" id="id" name="id" required placeholder="Ej: 12345678">
        </div>
        <div class="col-md-6 mb-3">
            <label for="first_name" class="form-label">Nombre *</label>
            <input type="text" class="form-control" id="first_name" name="first_name" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="last_name" class="form-label">Apellido *</label>
            <input type="text" class="form-control" id="last_name" name="last_name" required>
        </div>
        <div class="col-md-6 mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email">
        </div>
        <div class="col-md-6 mb-3">
            <label for="hire_date" class="form-label">Fecha de contratación</label>
            <input type="date" class="form-control" id="hire_date" name="hire_date">
        </div>
    </div>
    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="{{ url_for('teachers.list_view') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
