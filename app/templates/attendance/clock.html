﻿﻿{% extends "base_public.html" %}
{% block title %}Marcar Asistencia{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 520px;">

    <div class="text-center mb-4">
        <div id="live-clock" style="font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums;">--:--:--</div>
        <div id="live-date" class="public-muted-text">Cargando fecha...</div>
        <h4 class="mt-3"><i class="bi bi-fingerprint me-2"></i>Registro de Asistencia</h4>
    </div>

    <div id="status-message" class="alert d-none" role="alert"></div>

    <div class="card public-light-card">
        <div class="card-body p-4">

            <div id="step-cedula">
                <label for="cedula" class="form-label fw-semibold">Ingresa tu cédula</label>
                <input type="text" inputmode="numeric" pattern="[0-9]*"
                       class="form-control form-control-lg text-center mb-3"
                       id="cedula" placeholder="00000000" maxlength="10"
                       style="font-size: 1.5rem; letter-spacing: 2px;">
                <button type="button" class="btn btn-primary w-100 btn-lg"
                        id="btn-validar"
                        onclick="iniciarBiometria()">
                    <i class="bi bi-fingerprint me-2"></i>Validar con biometría
                </button>
                <small class="text-muted d-block text-center mt-2">
                    Usa tu huella o Face ID para confirmar tu identidad.
                </small>
            </div>

            <div id="step-bio" class="d-none text-center py-3">
                <div class="spinner-border text-primary mb-3" role="status" style="width: 3rem; height: 3rem;">
                    <span class="visually-hidden">Esperando biometría...</span>
                </div>
                <p class="mb-0">Confirma tu identidad en tu teléfono...</p>
            </div>

        </div>
    </div>
</div>

<script>
// ------------------------------------------------------------
// Helpers
// ------------------------------------------------------------
function getCsrfToken() {
    const meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.content : '';
}

function b64urlToBuf(b64url) {
    const b64 = b64url.replace(/-/g, '+').replace(/_/g, '/');
    const pad = '='.repeat((4 - b64.length % 4) % 4);
    const raw = atob(b64 + pad);
    const buf = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
    return buf;
}

function bufToB64url(buf) {
    const bytes = new Uint8Array(buf);
    let binary = '';
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function showMessage(msg, type = 'info') {
    const el = document.getElementById('status-message');
    el.className = `alert alert-${type}`;
    el.textContent = msg;
    el.classList.remove('d-none');
}

// ------------------------------------------------------------
// Reloj en vivo
// ------------------------------------------------------------
function updateClock() {
    const now = new Date();
    document.getElementById('live-clock').textContent =
        now.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    document.getElementById('live-date').textContent =
        now.toLocaleDateString('es-VE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
updateClock();
setInterval(updateClock, 1000);

// ------------------------------------------------------------
// Flujo biométrico
// ------------------------------------------------------------
async function iniciarBiometria() {
    const cedula = document.getElementById('cedula').value.trim();
    const csrfToken = getCsrfToken();
    const btn = document.getElementById('btn-validar');

    if (!cedula || !/^\d{5,10}$/.test(cedula)) {
        showMessage('Ingresa una cédula válida.', 'warning');
        return;
    }

    if (!csrfToken) {
        showMessage('Error: token de seguridad no encontrado. Recarga la página.', 'danger');
        return;
    }

    document.getElementById('step-cedula').classList.add('d-none');
    document.getElementById('step-bio').classList.remove('d-none');
    btn.disabled = true;

    try {
        // 1. Pedir opciones al servidor
        const res = await fetch('/webauthn/authenticate/begin', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken,
                'Accept': 'application/json'
            },
            body: JSON.stringify({ cedula })
        });

        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error || 'Error al iniciar biometría.');
        }

        const options = await res.json();
        options.challenge = b64urlToBuf(options.challenge);
        if (options.allowCredentials) {
            options.allowCredentials = options.allowCredentials.map(c => ({
                ...c,
                id: b64urlToBuf(c.id)
            }));
        }

        // 2. Pedir biometría al navegador
        const assertion = await navigator.credentials.get({ publicKey: options });

        // 3. Enviar firma al servidor
        const payload = {
            id: assertion.id,
            rawId: bufToB64url(assertion.rawId),
            type: assertion.type,
            response: {
                clientDataJSON: bufToB64url(assertion.response.clientDataJSON),
                authenticatorData: bufToB64url(assertion.response.authenticatorData),
                signature: bufToB64url(assertion.response.signature),
                userHandle: assertion.response.userHandle
                    ? bufToB64url(assertion.response.userHandle) : null
            },
            action: 'in'
        };

        const verifyRes = await fetch('/webauthn/authenticate/complete', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken,
                'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const result = await verifyRes.json();

        if (verifyRes.ok) {
            showMessage(result.message || 'Asistencia registrada.', 'success');
            document.getElementById('cedula').value = '';
        } else {
            showMessage(result.error || 'Error al verificar.', 'danger');
        }
    } catch (err) {
        console.error(err);
        showMessage(err.message || 'Error en la validación biométrica.', 'danger');
    } finally {
        document.getElementById('step-bio').classList.add('d-none');
        document.getElementById('step-cedula').classList.remove('d-none');
        btn.disabled = false;
        document.getElementById('cedula').focus();
    }
}

// Enter para enviar
document.getElementById('cedula').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        e.preventDefault();
        iniciarBiometria();
    }
});
</script>
{% endblock %}
