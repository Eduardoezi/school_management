name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar pip-tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools

      - name: Instalar dependencias (dev)
        run: pip-sync requirements-dev.txt

      - name: Lint con ruff
        run: ruff check .

      - name: Formato con ruff
        run: ruff format --check .

      - name: Tests con pytest
        env:
          FLASK_ENV: development
          SECRET_KEY: ci-test-secret-not-real
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        run: pytest -v --cov=app --cov-report=term-missing